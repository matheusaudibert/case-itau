<div class="cabecalho">
  <h1>Produtos</h1>
  <div class="acoes">
    <button mat-stroked-button (click)="carregar()" [disabled]="carregando()">
      <mat-icon>refresh</mat-icon>
      Atualizar
    </button>
    <button mat-flat-button (click)="abrirNovoProduto()">
      <mat-icon>add</mat-icon>
      Novo produto
    </button>
  </div>
</div>

<mat-card appearance="outlined">
  @if (carregando()) {
    <mat-progress-bar mode="indeterminate" />
  }

  <table mat-table [dataSource]="produtos()">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>Id</th>
      <td mat-cell *matCellDef="let p">
        <a [routerLink]="['/produtos', p.id]" (click)="$event.stopPropagation()">{{ p.id }}</a>
      </td>
    </ng-container>

    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef>Nome</th>
      <td mat-cell *matCellDef="let p">{{ p.nome }}</td>
    </ng-container>

    <ng-container matColumnDef="total">
      <th mat-header-cell *matHeaderCellDef class="numero">Total</th>
      <td mat-cell *matCellDef="let p" class="numero">{{ p.total }}</td>
    </ng-container>

    <ng-container matColumnDef="disponivel">
      <th mat-header-cell *matHeaderCellDef class="numero">Disponível</th>
      <td mat-cell *matCellDef="let p" class="numero destaque">{{ p.disponivel }}</td>
    </ng-container>

    <ng-container matColumnDef="reservado">
      <th mat-header-cell *matHeaderCellDef class="numero">Reservado</th>
      <td mat-cell *matCellDef="let p" class="numero">{{ p.reservado }}</td>
    </ng-container>

    <ng-container matColumnDef="bloqueado">
      <th mat-header-cell *matHeaderCellDef class="numero">Bloqueado</th>
      <td mat-cell *matCellDef="let p" class="numero">{{ p.bloqueado }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="colunas"></tr>
    <tr
      mat-row
      *matRowDef="let p; columns: colunas"
      class="linha"
      matTooltip="Abrir produto"
      (click)="abrir(p)"
    ></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="vazio" [attr.colspan]="colunas.length">
        {{ carregando() ? 'Carregando...' : 'Nenhum produto cadastrado.' }}
      </td>
    </tr>
  </table>
</mat-card>
